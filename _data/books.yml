- id: mamun2026quantum
  display_title: 'Quantum-Resilient Cryptography: Lattice Foundations, Thermodynamics & Advanced Synthesis'
  title: Quantum-Resilient Cryptography
  subtitle: Lattice Foundations, Thermodynamics & Advanced Synthesis
  authors:
  - Syed Muntasir Mamun
  role: Sole author
  publisher: Amazon Kindle (publisher not stated)
  publication_date: '2026-08-30'
  year: 2026
  language: English
  description: 'Is post-quantum cryptography actually post-quantum? Quantum-Resilient Cryptography: Lattice Foundations, Thermodynamics & Advanced Synthesis challenges the core assumptions of modern cryptographic security in the quantum era. While the NIST post-quantum standards (ML-KEM, ML-DSA, FN-DSA) represent a significant achievement, their reliance on discrete Gaussian noise in lattice-based schemes shares a structural isomorphism with the correctable displacement errors targeted by Gottesman-Kitaev-Preskill (GKP) bosonic codes. As quantum hardware matures and syndrome extraction becomes efficient at scale, what serves as cryptographic protection today risks becoming a routine error-correction subroutine tomorrow. This comprehensive research monograph argues that cryptographic security must move beyond provisional algorithmic intractability (Tier 1) and be grounded in physical irreversibility. It introduces a rigorous three-tier taxonomy for post-post-quantum security, charting a practical
    engineering pathway toward Tier 2 (Physical Security)—anchored in thermodynamic costs, non-Gaussian noise engineering, and QRAM-hard primitives—and eventually Tier 3 (Device-Independent Security). Designed for researchers, implementers, policymakers, and advanced cryptography students, this book provides the conceptual vocabulary and technical foundations necessary to protect information that must remain confidential long after today''s quantum hardware has matured.'
