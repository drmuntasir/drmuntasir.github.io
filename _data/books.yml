  publisher: Independently published (Amazon KDP Print)
  publication_date: '2021-08-20'
  year: 2021
  language: English
  description: This book is an indicator of what the entirety of blockchain means for the individual, for the society and for the many tenets of the markets and governance. In this book, we explore its signposts which determine the possible gamification of this emerging yet powerful foundational technology. A very particular emphasis is placed on the so-called BOP markets and the institutional voids underpinning their roots. A wide spectrum of political economy implications of blockchains is assessed. How Blockchains interact with the market and its political dynamics are considered. The book brings out the gaming and collusion aspects of a core and foundational emergent technology in the context of human political consciousness. The book is also an anthology of resources which can be utilised to understand the nature, context, contours and consequences of the blockchains technology beyond the immediate realms of technology and into the shaping of the existential realms of the human individual.
    The book, first in a series, makes an attempt to highlight some core aspects of human agency and franchise – and ultimately – the human identity in the age of blockchains and its many possibilities. This is a handbook for politicians in an age of transformational technology. This is a handbook for the individual to learn using an emergent foundational technology for political aims.
