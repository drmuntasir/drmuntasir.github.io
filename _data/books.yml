- id: mamun2026sovereign
  display_title: 'Sovereign AI in Base of the Pyramid Markets: A Policy and Infrastructure Blueprint for Equitable AI Governance in Low-Income Nations'
  title: Sovereign AI in Base of the Pyramid Markets
  subtitle: A Policy and Infrastructure Blueprint for Equitable AI Governance in Low-Income Nations
  authors:
  - Syed Muntasir Mamun
  - Riaz Faride
  - Eric Hansel
  - Markus Krebsz
  role: Lead author (first-listed; led the international author team)
  publisher: Amazon Kindle (publisher not stated)
  publication_date: '2026-09-07'
  year: 2026
  language: English
  description: 'The Neural Age is here — and the world''s poorest nations risk being left behind. In a world rapidly reshaped by artificial intelligence, Base of the Pyramid (BOP) markets face an existential crisis: Compute Deserts, Capital Deficits, and Institutional Voids that threaten to entrench permanent cognitive and economic divergence. Sovereign AI in Base of the Pyramid Markets presents a groundbreaking, integrated policy and infrastructure blueprint for transforming low-income nations from passive data consumers into active architects of the Neural Age. Authored by an interdisciplinary team spanning diplomacy, enterprise technology, marine digital transformation, and AI governance, this book proposes a UN-led architecture for equitable AI sovereignty. Through rigorous stress-testing of complex failure modes — currency volatility, algorithmic drift, and geopolitical fragmentation — this book charts a path from algorithmic dependency to managed interdependence in liquid modernity.
    Aligned with the UN Global Digital Compact and the Sustainable Development Goals (SDGs).'
